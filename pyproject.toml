[project]
name = "pride-bus"
version = "1.0.0"
description = "API handler for the finding the pride bus"
authors = [{ name = "TransitMatters Labs Team" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.32.3",
    "boto3>=1.34.118,<2.0.0",
    "datadog-lambda>=8.129.0,<8.130.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pip>=24.1",
    "chalice==1.34.0",
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".chalice", ".venv"]

[tool.ruff.lint]
# E/F are pyflakes + pycodestyle (the flake8 core). E731 = "do not assign a
# lambda" was previously ignored in .flake8, so keep ignoring it.
select = ["E", "F", "W"]
ignore = ["E731"]
