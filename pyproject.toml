[project]
name = "pride-bus"
version = "1.0.0"
description = "API handler for the finding the pride bus"
authors = [{ name = "TransitMatters Labs Team" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.32.3",
    "boto3>=1.34.118,<2.0.0",
    "datadog-lambda>=6.104.0,<6.105.0",
    # datadog-lambda only requires ddtrace>=2.17.0; pin to the 2.x line whose
    # API (e.g. ddtrace.Span) datadog-lambda 6.104 still imports.
    "ddtrace>=2.17.0,<3.0.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pip>=24.1",
    "chalice==1.31.3",
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".chalice", ".venv"]

[tool.ruff.lint]
# E/F are pyflakes + pycodestyle (the flake8 core). E731 = "do not assign a
# lambda" was previously ignored in .flake8, so keep ignoring it.
select = ["E", "F", "W"]
ignore = ["E731"]
