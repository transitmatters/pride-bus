name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node/Python via mise
        uses: jdx/mise-action@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Check if package-lock.json is up to date
        run: |
          npx --yes package-lock-utd@1.1.0
      - name: Lint frontend code with ESLint
        run: |
          npm ci
          npm run lint-frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node/Python via mise
        uses: jdx/mise-action@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      # Runs Ruff lint + format checks, the uv.lock consistency check, and
      # file-hygiene hooks, matching what runs locally via pre-commit.
      - name: Lint backend code with pre-commit
        run: |
          uv run pre-commit run --all-files
